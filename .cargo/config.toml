[unstable]
# Implementations like memcpy, memset
build-std-features = ["compiler-builtins-mem"]
# core lib is distributed with Rust compiler as pre-compiled lib, so only supported host triples have it
# We need to recompile these 2 for basic Rust types etc.
build-std = ["core", "compiler_builtins"]

[build]
target = "x86_64-bare_os.json"

# Applies to all targets whose os is none
[target.'cfg(target_os="none")']
## This allows us to just run cargo run which runs the bootimage runner to launch QEMU
runner = "bootimage runner"
